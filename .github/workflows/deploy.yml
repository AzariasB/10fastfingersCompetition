name: Update Chrome Extension

on:
  workflow_run:
    workflows: [CI]
    branches: ['v2.x']
    types:
      - completed

jobs:
  build-chrome-extension:
    name: Build Chrome extension artifact
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
      - name: Build
        run: |
          pnpm install
          pnpm build
          zip -r 10fastfingers-${{ github.sha }}.zip dist

      - name: Archive chrome-extension artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 10fastfingers-${{ github.sha }}
          path: 10fastfingers-${{ github.sha }}.zip
  # api usage reference:
  # * <https://developer.chrome.com/docs/webstore/using_webstore_api/>
  # * <https://github.com/fregante/chrome-webstore-upload/blob/main/How%20to%20generate%20Google%20API%20keys.md>
  upload-extension:
    name: Upload extension
    runs-on: ubuntu-latest
    needs: build-chrome-extension
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Download bundle artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: 10fastfingers-${{ github.sha }}
      - name: Install webstore cli
        run: npm i -g chrome-webstore-upload-cli@4.0.1
      - name: Upload step
        run: >-
          chrome-webstore-upload upload
          --auto-publish
          --source "10fastfingers-${{ github.sha }}.zip"
          --extension-id "${{ env.EXTENSION_ID }}"
        env:
          EXTENSION_ID: jgnpbbnjekmldfdbgkmijclckednldll
          CLIENT_ID: "${{ secrets.CI_GOOGLE_CLIENT_ID }}"
          CLIENT_SECRET: "${{ secrets.CI_GOOGLE_CLIENT_SECRET }}"
          REFRESH_TOKEN: "${{ secrets.CI_GOOGLE_REFRESH_TOKEN }}"
          PUBLISHER_ID: "${{ secrets.CI_GOOGLE_PUBLISHER_ID }}"